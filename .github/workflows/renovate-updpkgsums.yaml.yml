name: Update Package Sums on PR
on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - development
    paths:
      - pkgbuilds/**

permissions:
  contents: read

concurrency:
  group: updpkgsums-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  PKGBUILDS_DIR: pkgbuilds

jobs:
  find_packages_with_changes:
    if: ${{ startsWith(github.head_ref, 'renovate/') }}
    name: Find packages with changes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find packages with changes
        id: set-packages
        run: |
          # find directories in pkgbuilds containing a PKGBUILD that have changes in the PR
          packages=$(
            git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- pkgbuilds/**/PKGBUILD \
            | xargs -n 1 dirname \
            | sed 's|^pkgbuilds/||' \
            | xargs -n 1 basename \
            | sort -u \
            | awk '{ printf "%s\"%s\"", sep, $0; sep=", " }'
          )
          echo "packages=[$packages]" >> $GITHUB_OUTPUT
          echo "Found packages with changes: $packages"

  update_checksums:
    if: ${{ startsWith(github.head_ref, 'renovate/') }}
    name: Update Checksums
    needs: find_packages_with_changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:multilib-devel
    env:
      BUILD_USER: builder
    steps:
      - name: Detect repository name
        id: detect_repository_name
        run: echo "value=${GITHUB_REPOSITORY#*/}" >> $GITHUB_OUTPUT
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@v3
        with:
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ steps.detect_repository_name.outputs.value }}
      - name: Update system & install requirements
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git jq sudo pacman-contrib
      - name: Checkout build sources
        uses: actions/checkout@v7
        with:
          token: '${{ steps.get_token.outputs.token }}'
          ref: ${{ github.head_ref }}
      - name: Create build user
        run: |
          useradd -m ${{ env.BUILD_USER }}
          echo "${{ env.BUILD_USER }} ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Recalculate Checksums
        working-directory: ./${{ env.PKGBUILDS_DIR }}
        env:
          CHANGED_PACKAGES: ${{ needs.find_packages_with_changes.outputs.packages }}
        run: |
          for package in $(echo "$CHANGED_PACKAGES" | jq -r '.[]'); do
            echo "Updating checksums for $package"
            cd ./$package
            sudo -u builder updpkgsums
            cd ..
          done
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Update PKGBUILD checksums'
          file_pattern: '*/PKGBUILD'

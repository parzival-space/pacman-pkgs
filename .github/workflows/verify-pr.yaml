name: Verify PR Builds
on:
  pull_request:
    branches:
      - development
    paths:
      - pkgbuilds/**

permissions:
  contents: read

concurrency:
  group: verify-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  find_packages_with_changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Find packages with changes
        id: set-packages
        run: |
          # find directories in pkgbuilds containing a PKGBUILD that have changes in the PR
          packages=$(
            git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- pkgbuilds/**/PKGBUILD \
            | xargs -n 1 dirname \
            | sed 's|^pkgbuilds/||' \
            | xargs -n 1 basename \
            | sort -u \
            | awk '{ printf "%s\"%s\"", sep, $0; sep=", " }'
          )
          echo "packages=[$packages]" >> $GITHUB_OUTPUT
          echo "Found packages with changes: $packages"

  build_packages:
    needs: find_packages_with_changes
    runs-on: ubuntu-latest
    container:
      image: archlinux:multilib-devel
    strategy:
      matrix:
        name: ${{ fromJson(needs.find_packages_with_changes.outputs.packages) }}
    env:
      BUILD_USER: builder
    steps:
      - name: Update system & install requirements
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo
      - name: Checkout build sources
        uses: actions/checkout@v6
      - name: Create build user
        run: |
          useradd -m ${{ env.BUILD_USER }}
          echo "${{ env.BUILD_USER }} ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
      - name: Build ${{ matrix.name }}
        working-directory: ./${{ env.PKGBUILDS_DIR }}/${{ matrix.name }}
        run: |
          sudo -u builder makepkg -sri --noconfirm

name: Sync AUR packages
on:
#  push:
#    branches:
#      - development
#    paths:
#      - pkgbuilds/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-aur-${{ github.ref }}
  cancel-in-progress: false

env:
  PKGBUILDS_DIR: ./pkgbuilds

jobs:
  find_packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Find packages
        id: set-packages
        run: |
          # find directories in pkgbuilds containing a PKGBUILD
          packages=$(
            find ${{ env.PKGBUILDS_DIR }} -mindepth 2 -maxdepth 2 -type f -name PKGBUILD \
            -exec dirname {} \; \
            | sed 's|^pkgbuilds/||' \
            | xargs -n 1 basename \
            | sort -u \
            | awk '{ printf "%s\"%s\"", sep, $0; sep=", " }'
          )
          echo "packages=[$packages]" >> $GITHUB_OUTPUT
          echo "Found packages: $packages"

  sync_with_aur:
    name: "Sync ${{ matrix.package }}"
    needs: find_packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.find_packages.outputs.packages) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Check if package should be ignored
        working-directory: "./${{ env.PKGBUILDS_DIR }}/${{ matrix.package }}"
        id: aur_check
        run: |
          # ignore packages that contain a .no-aur-sync file
          if [ -f .no-aur-sync ]; then
              echo "Package ${{ matrix.package }} is marked to be ignored for AUR sync."
              echo "ignore=true" >> $GITHUB_OUTPUT
          else
              echo "ignore=false" >> $GITHUB_OUTPUT
          fi
      - name: Generate commit message
        working-directory: "./${{ env.PKGBUILDS_DIR }}/${{ matrix.package }}"
        id: commit_message
        run: |
          # generate commit message based on latest commit affecting the PKGBUILD
          latest_commit=$(git log -n 1 --pretty=format:"%s" -- "./")
          
          # extract version from PKGBUILD
          pkgbuild_pkgver=$(grep -E '^pkgver=' "./PKGBUILD" | cut -d'=' -f2)
          pkgbuild_pkgrel=$(grep -E '^pkgrel=' "./PKGBUILD" | cut -d'=' -f2)
          
          echo "commit_message<<EOF" >> $GITHUB_OUTPUT
          echo "Version bump to ${pkgbuild_pkgver}-${pkgbuild_pkgrel}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Latest commit message:" >> $GITHUB_OUTPUT
          echo "${latest_commit}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        if: false
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: "./${{ env.PKGBUILDS_DIR }}/${{ matrix.package }}/PKGBUILD"
          commit_message: ${{ steps.commit_message.outputs.commit_message }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          commit_username: ${{ secrets.AUR_USERNAME }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          test: true
          test_flags: '--clean --cleanbuild --syncdeps'
          allow_empty_commits: false # prevent commits with no changes


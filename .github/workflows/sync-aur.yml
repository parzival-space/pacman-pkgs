name: Sync AUR packages
on:
  push:
    branches:
      - development
    paths:
      - pkgbuilds/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-aur-${{ github.ref }}
  cancel-in-progress: false

env:
  PKGBUILDS_DIR: ./pkgbuilds

jobs:
  find_packages:
    name: "Find packages"
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Find packages
        id: set-packages
        run: |
          # find directories in pkgbuilds containing a PKGBUILD and not marked with .no-aur-sync
          packages=$(
            find ${{ env.PKGBUILDS_DIR }} -mindepth 2 -maxdepth 2 -type f -name PKGBUILD \
            -exec dirname {} \; \
            | while read -r pkgdir; do
                if [ ! -f "$pkgdir/.no-aur-sync" ]; then
                  echo "$pkgdir"
                fi
              done \
            | sed 's|^pkgbuilds/||' \
            | xargs -n 1 basename \
            | sort -u \
            | awk '{ printf "%s\"%s\"", sep, $0; sep=", " }'
          )
          echo "packages=[$packages]" >> $GITHUB_OUTPUT
          echo "Found packages: $packages"

  sync_with_aur:
    name: "Sync ${{ matrix.package }}"
    needs:
      - find_packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.find_packages.outputs.packages) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Test Build
        env:
          BUILD_USER: builder
        run: |
          # build package in a container instead of using the test flag in the aur sync step.
          # the aur sync step is unable to install build dependencies
          podman run --rm -i \
            -e BUILD_USER \
            -v "$(pwd):/repo:ro" \
            archlinux:multilib-devel bash -s <<'EOF'
          set -Eeuo pipefail
          
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo
          
          rm -rf /build
          mkdir -p /build
          cp -a /repo/. /build
          
          useradd -m $BUILD_USER
          echo "$BUILD_USER ALL=(ALL) NOPASSWD: ALL" > "/etc/sudoers.d/$BUILD_USER"
          chmod 0440 "/etc/sudoers.d/$BUILD_USER"
          
          chown -R "$BUILD_USER:$BUILD_USER" /build
          
          cd /build
          sudo -H -u "$BUILD_USER" makepkg -sri --noconfirm
          EOF
      - name: Generate commit message
        working-directory: "./${{ env.PKGBUILDS_DIR }}/${{ matrix.package }}"
        id: commit_message
        run: |
          # generate commit message based on latest commit affecting the PKGBUILD
          latest_commit=$(git log -n 1 --pretty=format:"%s" -- "./")
          
          # extract version from PKGBUILD
          pkgbuild_pkgver=$(grep -E '^pkgver=' "./PKGBUILD" | cut -d'=' -f2)
          pkgbuild_pkgrel=$(grep -E '^pkgrel=' "./PKGBUILD" | cut -d'=' -f2)
          
          echo "commit_message<<EOF" >> $GITHUB_OUTPUT
          echo "Version bump to ${pkgbuild_pkgver}-${pkgbuild_pkgrel}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Latest commit message:" >> $GITHUB_OUTPUT
          echo "${latest_commit}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Add NOTICE.md
        working-directory: "./${{ env.PKGBUILDS_DIR }}/${{ matrix.package }}"
        run: |
          echo "This package was automatically built and published from the GitHub repository at https://github.com/${{ github.repository }}." > NOTICE.md
          echo "If you want to contribute, please open an issue or a pull request in the repository." >> NOTICE.md
      - name: Collect additional assets
        working-directory: "./${{ env.PKGBUILDS_DIR }}/${{ matrix.package }}"
        id: collect_assets
        run: |
          # load PKGBUILD source PKGBUILD and specify all assets not starting with http:// or https://
          # workaround for https://github.com/KSXGitHub/github-actions-deploy-aur/issues/36
          source "./PKGBUILD"
          echo "assets<<EOF" >> $GITHUB_OUTPUT
          for src in ${source[@]}; do
              # split at :: and check last entry for URL prefix
              src_file=$(echo "$src" | awk -F '::' '{print $NF}')
              if [[ ! "$src_file" =~ ^https?:// ]]; then
                  echo "${{ env.PKGBUILDS_DIR }}/${{ matrix.package }}/$src_file" >> $GITHUB_OUTPUT
              fi
          done
          echo "${{ env.PKGBUILDS_DIR }}/${{ matrix.package }}/NOTICE.md" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: "./${{ env.PKGBUILDS_DIR }}/${{ matrix.package }}/PKGBUILD"
          commit_message: ${{ steps.commit_message.outputs.commit_message }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          commit_username: ${{ secrets.AUR_USERNAME }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          test: false # already tested
          allow_empty_commits: false # prevent commits with no changes
          assets: ${{ steps.collect_assets.outputs.assets }}

